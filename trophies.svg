<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
  <title id="title">Local trophies for Janakiraman</title>
  <desc id="desc">Animated local trophy grid with glowing ranks and shine sweep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#180417"/><stop offset="1" stop-color="#160828"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".56"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="0" y="0" width="820" height="340" rx="28"/></clipPath>
    <style><![CDATA[
      .cell { opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .75s cubic-bezier(.2,.9,.2,1.2) forwards; filter:url(#glow); }
      @keyframes pop { 0%{opacity:0; transform:scale(.72) translateY(24px)} 100%{opacity:1; transform:scale(1) translateY(0)} }
      .sweep { animation:sweep 4.2s ease-in-out infinite; }
      @keyframes sweep { 0%{transform:translateX(-220px) skewX(-20deg)} 55%,100%{transform:translateX(920px) skewX(-20deg)} }
    ]]></style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="820" height="340" rx="28" fill="url(#bg)"/>
    <text x="42" y="44" fill="#fff0fb" font-size="27" font-family="Arial Black, Arial, sans-serif">Trophy Wall</text>
    
      <g class="cell" style="animation-delay:0.25s" transform="translate(34 74)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#ff4fb8" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#ff4fb8" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#ff4fb8" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">AI</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Builder</text>
      </g>
      <g class="cell" style="animation-delay:0.41000000000000003s" transform="translate(294 74)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#c026d3" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#c026d3" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#c026d3" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">A+</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Rank</text>
      </g>
      <g class="cell" style="animation-delay:0.5700000000000001s" transform="translate(554 74)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#8b5cf6" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#8b5cf6" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#8b5cf6" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">160</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Repos</text>
      </g>
      <g class="cell" style="animation-delay:0.73s" transform="translate(34 202)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#14b8a6" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#14b8a6" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#14b8a6" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">129</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Repo Stars</text>
      </g>
      <g class="cell" style="animation-delay:0.89s" transform="translate(294 202)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#f59e0b" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#f59e0b" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#f59e0b" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">224</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Profile Stars</text>
      </g>
      <g class="cell" style="animation-delay:1.05s" transform="translate(554 202)">
        <rect width="224" height="96" rx="20" fill="#211027" stroke="#38bdf8" stroke-opacity=".68"/>
        <path d="M88 22 h48 l-7 54 h-34 z" fill="#38bdf8" opacity=".34"/>
        <path d="M94 28 h36 v12 c0 18-36 18-36 0z" fill="none" stroke="#38bdf8" stroke-width="4"/>
        <text x="112" y="52" text-anchor="middle" fill="#fff0fb" font-size="25" font-family="Arial Black, Arial, sans-serif" font-weight="900">2021</text>
        <text x="112" y="78" text-anchor="middle" fill="#d8a9e8" font-size="14" font-family="Consolas, Monaco, monospace" font-weight="700">Since</text>
      </g>
    <rect class="sweep" x="0" y="0" width="92" height="340" fill="url(#shine)" opacity=".44"/>
  </g>
  <rect x="1" y="1" width="818" height="338" rx="27" fill="none" stroke="#ff64bd" stroke-opacity=".45"/>
</svg>