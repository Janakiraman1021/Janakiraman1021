name: Generate GitHub Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate custom-colored snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Janakiraman1021
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff4fb8&color_dots=#161b22,#3b1028,#6d1f68,#b52b92,#f255b6
            dist/github-snake-light.svg?palette=github-light&color_snake=#c026d3&color_dots=#ebedf0,#fce7f3,#f9a8d4,#e879f9,#a855f7

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
