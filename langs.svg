<svg xmlns="http://www.w3.org/2000/svg" width="820" height="484" viewBox="0 0 820 484" role="img" aria-labelledby="title desc">
  <title id="title">Local language bars for Janakiraman</title>
  <desc id="desc">Animated language bars computed from public repository primary-language counts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170416"/><stop offset="1" stop-color="#210a31"/></linearGradient>
    <style><![CDATA[
      .lang { opacity:0; animation:fadeUp .55s ease forwards; }
      @keyframes fadeUp { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
    ]]></style>
  </defs>
  <rect width="820" height="484" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="482" rx="27" fill="none" stroke="#ff64bd" stroke-opacity=".45"/>
  <text x="42" y="44" fill="#fff0fb" font-size="27" font-family="Arial Black, Arial, sans-serif">Language Mix</text>
  <text x="780" y="45" text-anchor="end" fill="#f0abfc" font-size="14" font-family="Consolas, Monaco, monospace">151 non-fork repos</text>
  
      <g class="lang" style="animation-delay:0.25s">
